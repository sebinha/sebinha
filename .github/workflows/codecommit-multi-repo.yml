name: Update CodeCommit activity (multi-repo)

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: sa-east-1
      DAYS: "1000"
      AUTHOR_REGEX: "victor.cardoso@virtsel.com.br"
    steps:
      - uses: actions/checkout@v4

      # Em geral, ubuntu-latest já tem AWS CLI; este step é um “cinto e suspensório”.
      - name: Ensure AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::050320262896:role/victor.cardoso
          aws-region: sa-east-1

      - name: Configure git for CodeCommit HTTPS helper
        run: |
          git config --global credential.helper '!aws codecommit credential-helper $@'
          git config --global credential.UseHttpPath true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run generator
        run: node scripts/update-codecommit-multi-repo.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update CodeCommit multi-repo stats" || exit 0
          git push
